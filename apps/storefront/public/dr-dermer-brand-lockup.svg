    <path d="M 6 6 L 6 38 M 3 6 L 14 6 M 3 38 L 14 38" stroke="#161A18" stroke-width="2.6" stroke-linecap="square"/>
    <!-- Outer Arc -->
    <path d="M 12 6 C 26 6, 36 14, 36 22 C 36 30, 26 38, 12 38" stroke="#161A18" stroke-width="2.6" stroke-linecap="round" fill="none"/>
