  <!-- Subtitle Tagline "Science. Skincare. Confidence." -->
  <text x="51" y="41" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.8" font-weight="600" fill="#5E6B64" letter-spacing="0.08em">Science. Skincare. Confidence.</text>
